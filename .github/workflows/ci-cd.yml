name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "sprint/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - windows-2025

    env:
      ORCHESTWIN_DATABASE_URL: postgresql+psycopg://orchestwin:ci-postgres-password@127.0.0.1:5432/orchestwin
      ORCHESTWIN_DATABASE_ECHO: "false"
      ORCHESTWIN_AUTH_JWT_SECRET: ci-jwt-secret-with-more-than-32-characters
      ORCHESTWIN_AUTH_JWT_ISSUER: orchestwin-studio
      ORCHESTWIN_AUTH_JWT_AUDIENCE: orchestwin-api
      ORCHESTWIN_CORS_ALLOWED_ORIGINS: '["http://127.0.0.1:5173"]'
      ORCHESTWIN_CORS_ALLOW_CREDENTIALS: "true"
      ORCHESTWIN_REQUIREMENTS_MODE: FAKE_DETERMINISTIC
      ORCHESTWIN_DESIGN_MODE: FAKE_DETERMINISTIC
      ORCHESTWIN_ARCHITECTURE_MODE: FAKE_DETERMINISTIC

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Set up PostgreSQL
        uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee # v8
        with:
          postgres-version: "18"
          username: orchestwin
          password: ci-postgres-password
          database: orchestwin
          port: "5432"

      - name: Show test environment
        run: |
          node --version
          npm --version
          python --version
          python -m pip --version
          psql --version

      - name: Install frontend dependencies
        run: npm run install:frontend

      - name: Install backend and test dependencies
        run: python -m pip install --disable-pip-version-check --editable . --requirement requirements-dev.txt

      - name: Verify Python dependencies
        run: python -m pip check

      - name: Verify frontend dependencies
        run: npm --prefix frontend ls --depth=0

      - name: Run backend tests with coverage
        if: runner.os == 'Linux'
        env:
          PYTHONWARNINGS: error
        run: npm run test:coverage:python

      - name: Run backend tests
        if: runner.os != 'Linux'
        env:
          PYTHONWARNINGS: error
        run: npm run test

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Upgrade PostgreSQL to Alembic head
        run: orchestwin-migrate upgrade head

      - name: Show current database revision
        run: orchestwin-migrate current

      - name: Run PostgreSQL integration tests with coverage
        if: runner.os == 'Linux'
        env:
          PYTHONWARNINGS: error
        run: npm run test:coverage:integration:python

      - name: Run PostgreSQL integration tests
        if: runner.os != 'Linux'
        env:
          PYTHONWARNINGS: error
        run: npm run test:integration:python

      - name: Upload backend coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          use_oidc: true
          files: ./coverage.xml
          flags: backend
          name: backend-coverage
          disable_search: true
          fail_ci_if_error: true

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - windows-2025

    env:
      HUSKY: 0

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Show build environment
        run: |
          node --version
          npm --version
          python --version
          python -m pip --version

      - name: Install repository tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install frontend dependencies
        run: npm run install:frontend

      - name: Install backend and build dependencies
        run: python -m pip install --disable-pip-version-check --editable . --requirement requirements-dev.txt

      - name: Verify Python dependencies
        run: python -m pip check

      - name: Verify frontend dependencies
        run: npm --prefix frontend ls --depth=0

      - name: Verify backend and frontend quality and builds
        run: npm run verify:all

  release:
    name: Semantic release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - test
      - build
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    env:
      HUSKY: 0

    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install release tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Create Git tag and GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
