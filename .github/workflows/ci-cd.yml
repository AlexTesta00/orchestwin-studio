name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "sprint/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - windows-2025

    env:
      ORCHESTWIN_DATABASE_URL: postgresql+psycopg://orchestwin:ci-postgres-password@127.0.0.1:5432/orchestwin
      ORCHESTWIN_DATABASE_ECHO: "false"
      ORCHESTWIN_AUTH_JWT_SECRET: ci-jwt-secret-with-more-than-32-characters
      ORCHESTWIN_AUTH_JWT_ISSUER: orchestwin-studio
      ORCHESTWIN_AUTH_JWT_AUDIENCE: orchestwin-api
      ORCHESTWIN_CORS_ALLOWED_ORIGINS: '["http://127.0.0.1:5173"]'
      ORCHESTWIN_CORS_ALLOW_CREDENTIALS: "true"
      ORCHESTWIN_REQUIREMENTS_MODE: FAKE_DETERMINISTIC
      ORCHESTWIN_DESIGN_MODE: FAKE_DETERMINISTIC
      ORCHESTWIN_ARCHITECTURE_MODE: FAKE_DETERMINISTIC

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Set up PostgreSQL
        uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee # v8
        with:
          postgres-version: "18"
          username: orchestwin
          password: ci-postgres-password
          database: orchestwin
          port: "5432"

      - name: Show test environment
        run: |
          node --version
          npm --version
          python --version
          python -m pip --version
          psql --version

      - name: Install frontend dependencies
        run: npm run install:frontend

      - name: Install backend and test dependencies
        run: python -m pip install --disable-pip-version-check --editable . --requirement requirements-dev.txt

      - name: Verify Python dependencies
        run: python -m pip check

      - name: Verify frontend dependencies
        run: npm --prefix frontend ls --depth=0

      - name: Run backend tests with coverage
        if: runner.os == 'Linux'
        env:
          PYTHONWARNINGS: error
        run: npm run test:coverage:python

      - name: Run backend tests
        if: runner.os != 'Linux'
        env:
          PYTHONWARNINGS: error
        run: npm run test

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Upgrade PostgreSQL to Alembic head
        run: orchestwin-migrate upgrade head

      - name: Show current database revision
        run: orchestwin-migrate current

      - name: Verify durable JVM execution API and Gate 7 operations
        env:
          ORCHESTWIN_JVM_API_TEST_DATABASE_URL: postgresql+psycopg://orchestwin:ci-postgres-password@127.0.0.1:5432/orchestwin
          ORCHESTWIN_JVM_OPERATION_TEST_DATABASE_URL: postgresql+psycopg://orchestwin:ci-postgres-password@127.0.0.1:5432/orchestwin
          ORCHESTWIN_WEB_OPERATION_TEST_DATABASE_URL: postgresql+psycopg://orchestwin:ci-postgres-password@127.0.0.1:5432/orchestwin
        run: python -m pytest -q src/test/python/integration/test_jvm_operation_postgres.py src/test/python/integration/test_web_operation_postgres.py src/test/python/integration/test_jvm_execution_api_postgres.py

      - name: Run PostgreSQL integration tests with coverage
        if: runner.os == 'Linux'
        env:
          PYTHONWARNINGS: error
        run: npm run test:coverage:integration:python

      - name: Run PostgreSQL integration tests
        if: runner.os != 'Linux'
        env:
          PYTHONWARNINGS: error
        run: npm run test:integration:python

      - name: Upload backend coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          use_oidc: true
          files: ./coverage.xml
          flags: backend
          name: backend-coverage
          disable_search: true
          fail_ci_if_error: true

  web-execution:
    name: Verify Web runners and fixture contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      HUSKY: 0

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install backend and test dependencies
        run: python -m pip install --disable-pip-version-check --editable . --requirement requirements-dev.txt

      - name: Validate pinned runner manifest
        run: npm run verify:web-runners

      - name: Verify complete Web profile fixture matrix
        run: npm run test:web-fixtures

      - name: Build controlled Web runner images
        run: |
          docker build --pull --file infra/web-runners/Dockerfile.node --tag orchestwin/web-node-runner:ci .
          docker build --pull --file infra/web-runners/browser-locked/Dockerfile --tag orchestwin/web-browser-runner:ci .
          docker build --pull --file infra/web-runners/Dockerfile.php --tag orchestwin/web-php-runner:ci .
          docker build --network none --tag orchestwin/web-dependency-proxy:ci infra/web-runners/dependency-network

      - name: Test restricted dependency proxy without external network
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --user 65532:65532 --memory 256m --pids-limit 64 --mount "type=bind,source=$PWD/infra/web-runners/dependency-network,target=/tests,readonly" orchestwin/web-node-runner:ci node --test /tests/proxy.test.mjs

      - name: Smoke test non-root runner images without network
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 512m orchestwin/web-node-runner:ci node --version
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 512m orchestwin/web-browser-runner:ci node -e 'if (process.getuid() === 0 || require("playwright/package.json").version !== "1.62.1" || require("axe-core/package.json").version !== "4.13.0") process.exit(1)'
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 512m orchestwin/web-php-runner:ci php --version

      - name: Record local runner image identities
        run: |
          docker image inspect --format '{{.Id}}' orchestwin/web-node-runner:ci
          docker image inspect --format '{{.Id}}' orchestwin/web-browser-runner:ci
          docker image inspect --format '{{.Id}}' orchestwin/web-php-runner:ci

  verify-jvm-runners:
    name: Verify JVM runners and fixture contracts
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      HUSKY: 0

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install backend and test dependencies
        run: python -m pip install --disable-pip-version-check --editable . --requirement requirements-dev.txt

      - name: Validate pinned JVM runner and tool-distribution manifest
        run: npm run verify:jvm-runners

      - name: Validate repository-owned JVM fixture contracts
        run: npm run verify:jvm-execution-contracts

      - name: Verify complete JVM fixture matrix
        run: npm run test:jvm-fixtures

      - name: Check executable Gradle launcher modes
        run: |
          test -x src/test/fixtures/jvm_execution/jvm-java-greeting/gradlew
          test -x src/test/fixtures/jvm_execution/jvm-kotlin-calculator/gradlew

      - name: Build controlled JVM runner images
        run: |
          docker build --pull --network none --file infra/jvm-runners/Dockerfile.gradle --tag orchestwin/jvm-gradle-runner:ci .
          docker build --pull --network none --file infra/jvm-runners/Dockerfile.sbt --tag orchestwin/jvm-sbt-runner:ci .
          docker build --pull --network none --tag orchestwin/jvm-dependency-proxy:ci infra/jvm-runners/dependency-network

      - name: Test restricted JVM dependency proxy without external network
        shell: bash
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65532:65532 \
            --cpus 1 --memory 256m --pids-limit 64 \
            --mount "type=bind,source=$PWD/infra/jvm-runners/dependency-network,target=/tests,readonly" \
            --entrypoint node orchestwin/jvm-dependency-proxy:ci --test /tests/proxy.test.mjs

      - name: Regenerate Gradle launchers offline and verify exact bytes
        shell: bash
        run: |
          wrapper_root="$(mktemp -d "$RUNNER_TEMP/jvm-wrapper.XXXXXX")"
          chmod 777 "$wrapper_root"
          touch "$wrapper_root/settings.gradle"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65532:65532 \
            --cpus 2 --memory 1536m --pids-limit 256 \
            --tmpfs /tmp:rw,exec,nosuid,size=1073741824,mode=1777 \
            --mount "type=bind,source=$wrapper_root,target=/workspace" \
            --workdir /workspace --env GRADLE_USER_HOME=/tmp/gradle --env HOME=/tmp \
            --entrypoint gradle orchestwin/jvm-gradle-runner:ci \
            --offline --no-daemon --console=plain :wrapper --gradle-version 9.5.0 \
            --distribution-type bin \
            --gradle-distribution-sha256-sum 553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746 \
            --no-validate-url
          python scripts/verify_jvm_execution_contracts.py --repository-root . --generated-wrapper-root "$wrapper_root"

      - name: Bootstrap both fixture wrappers from the pinned ZIP without network
        shell: bash
        run: |
          launcher_root="$(mktemp -d "$RUNNER_TEMP/jvm-launcher-bootstrap.XXXXXX")"
          seed_container_id=""
          cleanup_seed() {
            if [[ "$seed_container_id" =~ ^[0-9a-f]{64}$ ]]; then
              docker rm --force "$seed_container_id"
            fi
          }
          trap cleanup_seed EXIT
          seed_container_id="$(docker create --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65532:65532 \
            orchestwin/jvm-gradle-runner:ci)"
          [[ "$seed_container_id" =~ ^[0-9a-f]{64}$ ]]
          docker cp "$seed_container_id:/opt/orchestwin/gradle-9.5.0-bin.zip" "$launcher_root/distribution.zip"
          docker rm "$seed_container_id"
          seed_container_id=""
          for fixture in jvm-java-greeting jvm-kotlin-calculator; do
            python - "$PWD" "$launcher_root" "$fixture" > "$launcher_root/$fixture.settings" <<'PY'
          import json, shutil, sys
          from pathlib import Path, PurePosixPath
          from uuid import uuid4
          from orchestwin.jvm_execution.launcher_cache import seed_gradle_wrapper_cache
          repository, output = (Path(value).resolve(strict=True) for value in sys.argv[1:3])
          fixture = repository / "src/test/fixtures/jvm_execution" / sys.argv[3]
          workspace = output / sys.argv[3]
          workspace.mkdir()
          for relative in json.loads((fixture / "fixture.json").read_text())["source_paths"]:
              path = PurePosixPath(relative)
              source, destination = fixture / relative, workspace / relative
              if path.is_absolute() or ".." in path.parts or "\\" in relative or source.resolve() != source:
                  raise ValueError("Fixture source path is not canonical")
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
          receipt = seed_gradle_wrapper_cache(
              workspace_root=workspace, attempt_id=uuid4(), distribution_path=output / "distribution.zip"
          )
          assert not Path(str(workspace / receipt.destination_relative) + ".ok").exists()
          print("/workspace/" + receipt.gradle_user_home_relative)
          print(receipt.destination_relative + ".ok")
          PY
            mapfile -t setup_values < "$launcher_root/$fixture.settings"
            [[ "${#setup_values[@]}" -eq 2 ]]
            workspace="$launcher_root/$fixture"
            [[ "$(realpath -- "$workspace")" == "$RUNNER_TEMP"/jvm-launcher-bootstrap.*/"$fixture" ]]
            sudo chown --recursive --no-dereference -- 65532:65532 "$workspace"
            docker run --rm --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges --user 65532:65532 \
              --cpus 2 --memory 768m --pids-limit 256 \
              --tmpfs /tmp:rw,exec,nosuid,nodev,size=134217728,mode=1777 \
              --mount "type=bind,source=$workspace,target=/workspace" \
              --workdir /workspace --env "GRADLE_USER_HOME=${setup_values[0]}" --env HOME=/tmp \
              orchestwin/jvm-gradle-runner:ci ./gradlew --version --offline --no-daemon \
              | tee "$launcher_root/$fixture.log"
            grep -Fx 'Gradle 9.5.0' "$launcher_root/$fixture.log"
            test -f "$workspace/${setup_values[1]}"
          done

      - name: Smoke test non-root runner images without network
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 768m orchestwin/jvm-gradle-runner:ci gradle --version
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 768m orchestwin/jvm-sbt-runner:ci sbt --script-version

      - name: Record local JVM runner image identities
        run: |
          docker image inspect --format '{{.Id}}' orchestwin/jvm-gradle-runner:ci
          docker image inspect --format '{{.Id}}' orchestwin/jvm-sbt-runner:ci
          docker image inspect --format '{{.Id}}' orchestwin/jvm-dependency-proxy:ci

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - windows-2025

    env:
      HUSKY: 0

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Show build environment
        run: |
          node --version
          npm --version
          python --version
          python -m pip --version

      - name: Install repository tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install frontend dependencies
        run: npm run install:frontend

      - name: Install backend and build dependencies
        run: python -m pip install --disable-pip-version-check --editable . --requirement requirements-dev.txt

      - name: Verify Python dependencies
        run: python -m pip check

      - name: Verify frontend dependencies
        run: npm --prefix frontend ls --depth=0

      - name: Verify backend and frontend quality and builds
        run: npm run verify:all

  release:
    name: Semantic release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - test
      - web-execution
      - verify-jvm-runners
      - build
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    env:
      HUSKY: 0

    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install release tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Create Git tag and GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
